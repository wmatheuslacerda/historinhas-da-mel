name: Post Você sabia

on:
  schedule:
    # 3 posts de imagem por dia: 10h, 15h e 20h de Brasília (UTC-3). Horários em UTC.
    - cron: "12 13,18,23 * * *"
  workflow_dispatch:
    inputs:
      postar:
        description: "Publicar? (false = só gera a imagem para você baixar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: postar-vocesabia
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Buscar o site das imagens (gh-pages)
        run: git fetch -q --depth=1 origin gh-pages:refs/remotes/origin/gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Pasta de imagens da semana
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fotos-$(TZ=America/Sao_Paulo date +%G-%V)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Imagens Você sabia? da semana"
          echo "TAG_FOTOS=$TAG" >> "$GITHUB_ENV"

      - name: Gerar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          TT_MODO: ${{ vars.TT_MODO || 'rascunho' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.postar }}" = "false" ]; then
            python -m src.vocesabia --nao-postar
          else
            python -m src.vocesabia
          fi

      - name: Guardar imagem (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocesabia-${{ github.run_number }}
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico
        if: success()
        run: |
          git config user.name "historinhas-bot"
          git config user.email "historinhas-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet && exit 0
          git commit -m "💡 novo Você sabia publicado"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
