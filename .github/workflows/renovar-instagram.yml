name: Renovar token do Instagram

on:
  schedule:
    # Toda quarta às 3h de Brasília — o token vale 60 dias, renovamos toda semana
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Renovar e salvar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python -m src.instagram --renovar
