name: Postar historinha

on:
  schedule:
    # 3 Shorts por dia: 8h, 12h e 18h de Brasília (UTC-3). Horários em UTC.
    - cron: "7 11,15,21 * * *"
  workflow_dispatch:
    inputs:
      postar:
        description: "Publicar no YouTube? (false = só gera o vídeo para você baixar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: postar-historinha
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar vídeo e publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.postar }}" = "false" ]; then
            python -m src.main --nao-postar
          else
            python -m src.main
          fi

      - name: Guardar vídeo (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar vídeo para o vídeo longo de domingo
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="semana-$(TZ=America/Sao_Paulo date +%G-%V)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Shorts da semana (usados no vídeo longo de domingo)"
          gh release upload "$TAG" saida/*.mp4 saida/*.json --clobber
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Postar no Instagram (Reels)
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.postar == false)
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          [ -z "$IG_ACCESS_TOKEN" ] && exit 0
          MP4=$(ls saida/*.mp4 | head -1)
          python -m src.instagram --release "$TAG" --video "$MP4" --roteiro "${MP4%.mp4}.json"

      - name: Enviar para o TikTok
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.postar == false)
        continue-on-error: true
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          TT_MODO: ${{ vars.TT_MODO || 'rascunho' }}
        run: |
          [ -z "$TT_REFRESH_TOKEN" ] && exit 0
          MP4=$(ls saida/*.mp4 | head -1)
          python -m src.tiktok --video "$MP4" --roteiro "${MP4%.mp4}.json"

      - name: Salvar histórico
        if: success()
        run: |
          git config user.name "historinhas-bot"
          git config user.email "historinhas-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet && exit 0
          git commit -m "📺 novo vídeo publicado"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
