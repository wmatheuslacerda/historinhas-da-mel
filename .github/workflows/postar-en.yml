name: Postar historinha (English)

on:
  schedule:
    # 3 Shorts em inglês por dia: 9h, 13h e 19h de Brasília (UTC-3). Horários em UTC.
    - cron: "22 12,16,22 * * *"
  workflow_dispatch:
    inputs:
      postar:
        description: "Publicar no YouTube? (false = só gera o vídeo para você baixar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: postar-historinha-en
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar vídeo e publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.postar }}" = "false" ]; then
            python -m src.main --idioma en --nao-postar
          else
            python -m src.main --idioma en
          fi

      - name: Guardar vídeo (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-en-${{ github.run_number }}
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico
        if: success()
        run: |
          git config user.name "historinhas-bot"
          git config user.email "historinhas-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet && exit 0
          git commit -m "🇺🇸 novo vídeo em inglês publicado"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
